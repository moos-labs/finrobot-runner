name: Run analysis

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Borsagator composed commands (overrides vars.COMMANDS)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # PINNED upstream commit (2026-11-13; the code the fleet's
          # proven runs used) — an unpinned clone lets upstream drift
          # change behaviour silently between sweeps.
          git init finrobot_src
          git -C finrobot_src remote add origin https://github.com/AI4Finance-Foundation/FinRobot.git
          git -C finrobot_src fetch --depth 1 origin 63e1884a42ea7b729551a5424b4bd6a65af636e0
          git -C finrobot_src checkout FETCH_HEAD
          pip install -e ./finrobot_src
          pip install openai

      - name: Run commands
        run: ${{ inputs.commands || vars.COMMANDS }}
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
